name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tests:
    name: ctest (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
    steps:
      - uses: actions/checkout@v7

      - name: Install Eigen / OpenMP
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then
            sudo apt-get update && sudo apt-get install -y libeigen3-dev
          else
            brew install eigen libomp
            echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"
          fi

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFMCA_BUILD_TESTS=ON
          -DFMCA_BUILD_PYTHON=OFF

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

  python-import:
    name: pip install + import (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools_scm needs tags

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: OpenMP (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Install
        run: python -m pip install -v .

      - name: Import
        run: python -c "import FMCA; print(FMCA.__file__)"
