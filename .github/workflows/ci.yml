name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cpp-tests:
    name: ctest (${{ matrix.os }}${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            label: ""
            cmake_extra: ""
          - os: ubuntu-latest
            label: ", no OpenMP"
            cmake_extra: "-DCMAKE_DISABLE_FIND_PACKAGE_OpenMP=ON"
          - os: macos-14
            label: ""
            cmake_extra: ""
    steps:
      - uses: actions/checkout@v7

      - name: Install OpenMP (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DFMCA_BUILD_TESTS=ON
          -DFMCA_BUILD_PYTHON=OFF
          ${{ matrix.cmake_extra }}

      - name: Build
        run: cmake --build build --parallel

      - name: Backtrace of failing test (Linux, OpenMP)
        if: runner.os == 'Linux' && matrix.cmake_extra == ''
        run: |
          sudo apt-get update
          sudo apt-get install -y gdb
          gdb -batch -ex run -ex bt --args build/tests/test_SampletBasis.out || true

      - name: Test
        run: ctest --test-dir build --output-on-failure --parallel

  python-import:
    name: pip install + import (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0   # setuptools_scm needs tags

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}

      - name: OpenMP (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libomp
          echo "OpenMP_ROOT=$(brew --prefix libomp)" >> "$GITHUB_ENV"

      - name: Install
        run: python -m pip install -v .

      - name: Import
        run: python -c "import FMCA; print(FMCA.__file__)"   # adjust module name
