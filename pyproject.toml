[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12", "setuptools_scm>=8"]
build-backend = "scikit_build_core.build"

[project]
name = "fmca"
dynamic = ["version"]
description = "Fast Multiresolution Covariance Analysis"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[project.urls]
Homepage = "https://github.com/muchip/fmca"

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.21"
cmake.build-type = "Release"
wheel.packages = []
sdist.exclude = ["py/*.ipynb", "build/", ".github/"]
metadata.version.provider = "scikit_build_core.metadata.setuptools_scm"

[tool.scikit-build.cmake.define]
FMCA_BUILD_TESTS = "OFF"

[tool.setuptools_scm]

[tool.cibuildwheel]
build-verbosity = 1
skip = ["*-musllinux_*", "*_i686", "*-win32", "*t-*"]   # no musl, 32-bit, free-threaded
test-command = "python -c \"import FMCA\""
build-frontend = "build"

[tool.cibuildwheel.linux]
# gcc in manylinux ships libgomp; auditwheel bundles it. Eigen comes via FetchContent.
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4" }

[tool.cibuildwheel.macos]
before-all = "brew install libomp"
environment = { OpenMP_ROOT = "$(brew --prefix libomp)", CMAKE_BUILD_PARALLEL_LEVEL = "4" }
# delocate bundles libomp.dylib into the wheel; the deployment target must match
# the Homebrew bottle, see overrides below

[tool.cibuildwheel.windows]
environment = { CMAKE_BUILD_PARALLEL_LEVEL = "4" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_arm64"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

[[tool.cibuildwheel.overrides]]
select = "*-macosx_x86_64"
inherit.environment = "append"
environment = { MACOSX_DEPLOYMENT_TARGET = "15.0" }
