[build-system]
requires = ["scikit-build-core>=0.10", "pybind11>=2.12"]
build-backend = "scikit_build_core.build"

[project]
name = "fmca"
version = "0.1.0"
description = "Fast Multiresolution Covariance Analysis"
readme = "README.md"
license = {text = "AGPL-3.0-only"}
requires-python = ">=3.9"
dependencies = ["numpy>=1.20"]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.21"
cmake.build-type = "Release"
wheel.packages = []
sdist.exclude = ["py/*.ipynb", "build/", ".github/"]

[tool.scikit-build.cmake.define]
FMCA_BUILD_TESTS = "OFF"
